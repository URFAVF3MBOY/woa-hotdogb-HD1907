name: Build hotdogb UEFI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # only used to attach the image to a release on v* tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm build-essential uuid-dev git curl

      - name: Cache downloaded dependencies (crypto binaries + Binaries/)
        uses: actions/cache@v4
        with:
          path: |
            MU_BASECORE/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep
            Binaries
          key: deps-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Build
        run: bash build.sh

      - name: Checksum
        run: cd out && sha256sum *.img | tee SHA256SUMS

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: oneplus-hotdogb-uefi
          path: out/
          if-no-files-found: error

      - name: Attach to release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
